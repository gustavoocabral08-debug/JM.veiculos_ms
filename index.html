<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JM Veículos - Carros e Motos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  body { background:#0f172a; color:#e2e8f0; }
  .cinzel { font-family:'Cinzel', serif; }
  .card { background:#1e293b; border-radius:12px; overflow:hidden; transition:.3s; border:1px solid #334155; }
  .card:hover { transform:translateY(-5px); box-shadow:0 10px 25px rgba(0,0,0,.4); border-color:#3b82f6; }
  .card img.cover { width:100%; height:210px; object-fit:cover; cursor:pointer; }
  .chip { background:#334155; color:#94a3b8; padding:6px 14px; border-radius:8px; transition:.2s; font-size:14px; }
  .chip:hover { background:#3b82f6; color:#fff; }
  .chip.on { background:#3b82f6; color:#fff; }
  .hero { position:relative; background:url('https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=1600&h=600&fit=crop') center/cover; }
  .hero::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg, rgba(15,23,42,.9), rgba(30,41,59,.65)); }
  .gallery-main { width:100%; height:420px; object-fit:cover; border-radius:12px; cursor:pointer; }
  .thumb { width:80px; height:80px; object-fit:cover; border-radius:8px; border:2px solid transparent; cursor:pointer; opacity:.7; }
  .thumb.on { border-color:#3b82f6; opacity:1; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.95); display:flex; align-items:center; justify-content:center; z-index:2000; }
  .lightbox img { max-width:90%; max-height:90%; object-fit:contain; }
  .lb-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.15); color:#fff; font-size:32px; padding:8px 18px; border-radius:8px; }
  .wpp { background:#25D366; color:#fff; padding:12px 24px; border-radius:12px; font-weight:bold; display:inline-block; transition:.3s; }
  .wpp:hover { background:#128C7E; transform:scale(1.05); }
  input, select { background:#1e293b; border:1px solid #334155; color:#e2e8f0; padding:8px 12px; border-radius:8px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ CONFIGURAÇÕES ============ */
const WHATSAPP_NUMBER = '556799495572';
const WHATSAPP_NAME   = 'BRENO';
const WHATSAPP_LABEL  = '(67) 9949-5572';

// Marcas mais comuns no Brasil
const MARCAS = {
  carro: ['Chevrolet','Volkswagen','Fiat','Ford','Toyota','Honda','Hyundai','Renault','Jeep','Nissan','Peugeot','Citroën','Mitsubishi'],
  moto:  ['Honda','Yamaha','Suzuki','Kawasaki','Harley-Davidson','BMW','Triumph','Royal Enfield','Shineray','Haojue','Dafra']
};

/* ============ ESTADO ============ */
let vehicles = [];
let page = 'home';
let selected = null;
let imgIndex = 0;
let f = { categoria:'todas', marca:'todas', status:'todos', busca:'', ordem:'recentes' };
let lb = { open:false, imgs:[], i:0 };

/* ============ UTILIDADES ============ */
const price = p => 'R$ ' + Number(p).toLocaleString('pt-BR');
const km = k => Number(k).toLocaleString('pt-BR') + ' km';
const statusColor = s => s === 'disponível' ? 'bg-green-600' : s === 'reservado' ? 'bg-yellow-500' : 'bg-red-600';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const FALLBACK = "this.onerror=null;this.src='https://placehold.co/800x500/1e293b/94a3b8?text=Sem+Imagem'";
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const foto = (v, i = 0) => (v.imagens && v.imagens[i]) || 'https://placehold.co/800x500/1e293b/94a3b8?text=Sem+Imagem';

/* ============ AÇÕES ============ */
window.go = p => { page = p; selected = null; window.scrollTo(0,0); render(); };
window.setF = (k, v) => { f[k] = v; if (k === 'categoria') f.marca = 'todas'; render(); };
window.setBusca = v => { f.busca = v; render(); const i = document.getElementById('busca'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } };
window.detail = id => { selected = vehicles.find(v => v.id === id); imgIndex = 0; page = 'detail'; window.scrollTo(0,0); render(); };
window.setImg = i => { imgIndex = i; render(); };
window.openLb = (id, i) => { const v = vehicles.find(x => x.id === id); lb = { open:true, imgs:v.imagens, i }; render(); };
window.closeLb = () => { lb.open = false; render(); };
window.lbMove = d => { lb.i = Math.max(0, Math.min(lb.imgs.length - 1, lb.i + d)); render(); };

document.addEventListener('keydown', e => {
  if (!lb.open) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowRight') lbMove(1);
  if (e.key === 'ArrowLeft') lbMove(-1);
});

/* ============ DADOS ============ */
async function load() {
  try {
    const r = await fetch('./veiculos.json');
    if (!r.ok) throw new Error('veiculos.json não encontrado');
    vehicles = await r.json();
  } catch (e) {
    console.error(e);
    vehicles = [];
  }
  render();
}

/* ============ COMPONENTES ============ */
function card(v) {
  return `
  <div class="card">
    <div class="relative">
      <img class="cover" src="${esc(foto(v))}" onerror="${FALLBACK}" onclick="openLb(${v.id},0)" alt="${esc(v.nome)}">
      <span class="absolute top-3 right-3 px-2 py-1 rounded text-xs text-white ${statusColor(v.status)}">${esc(cap(v.status))}</span>
      <span class="absolute top-3 left-3 px-2 py-1 rounded text-xs bg-slate-900/80 text-slate-200">${v.categoria === 'moto' ? '🏍️ Moto' : '🚗 Carro'}</span>
    </div>
    <div class="p-4">
      <h3 class="text-xl font-bold text-white">${esc(v.nome)}</h3>
      <p class="text-slate-400 text-sm">${esc(v.marca)} • ${v.ano} • ${km(v.km)}</p>
      <p class="text-slate-400 text-sm">${esc(v.combustivel)} • ${esc(v.cambio)} • ${esc(v.cor)}</p>
      <p class="text-blue-400 text-2xl font-bold mt-2">${price(v.preco)}</p>
      <button onclick="detail(${v.id})" class="w-full mt-3 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">Ver Detalhes</button>
    </div>
  </div>`;
}

function chips(list, key, current, allLabel = 'Todas') {
  return `<button class="chip ${current === 'todas' || current === 'todos' ? 'on' : ''}" onclick="setF('${key}','${key === 'status' ? 'todos' : 'todas'}')">${allLabel}</button>` +
    list.map(([val, label]) => `<button class="chip ${current === val ? 'on' : ''}" onclick="setF('${key}','${esc(val)}')">${esc(label)}</button>`).join('');
}

/* ============ PÁGINAS ============ */
function pageHome() {
  const dest = vehicles.filter(v => v.status === 'disponível').slice(0, 3);
  return `
  <section class="hero">
    <div class="relative z-10 container mx-auto px-4 py-24 text-center">
      <h1 class="cinzel text-4xl md:text-6xl font-bold text-white mb-6">Excelência, estilo e confiança<br>na sua garagem</h1>
      <p class="text-xl text-slate-300 mb-8">Carros e motos com garantia de procedência</p>
      <button onclick="go('vehicles')" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-semibold text-lg">Ver Ofertas</button>
    </div>
  </section>
  <section class="container mx-auto px-4 py-14">
    <h2 class="text-3xl font-bold text-center mb-10 text-white">Veículos em Destaque</h2>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${dest.map(card).join('') || '<p class="text-center text-slate-400 col-span-3">Nenhum veículo disponível no momento.</p>'}</div>
  </section>
  <section class="bg-slate-800 py-16 text-center px-4">
    <h2 class="text-4xl font-bold text-white mb-4">Pronto para começar?</h2>
    <p class="text-xl text-slate-300 mb-6">Com a JM Veículos, você está a um passo do veículo próprio.</p>
    <a class="wpp" target="_blank" href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('Olá ' + WHATSAPP_NAME + ', vim pelo site JM Veículos e tenho interesse em um veículo!')}">WhatsApp: ${WHATSAPP_LABEL} - ${WHATSAPP_NAME}</a>
  </section>`;
}

function pageVehicles() {
  const marcasLista = f.categoria === 'todas'
    ? [...new Set([...MARCAS.carro, ...MARCAS.moto])]
    : MARCAS[f.categoria];

  let list = vehicles.filter(v =>
    (f.categoria === 'todas' || v.categoria === f.categoria) &&
    (f.marca === 'todas' || v.marca === f.marca) &&
    (f.status === 'todos' || v.status === f.status) &&
    (!f.busca || (v.nome + ' ' + v.marca).toLowerCase().includes(f.busca.toLowerCase()))
  );
  if (f.ordem === 'menor') list.sort((a,b) => a.preco - b.preco);
  if (f.ordem === 'maior') list.sort((a,b) => b.preco - a.preco);
  if (f.ordem === 'recentes') list.sort((a,b) => b.ano - a.ano);

  return `
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6 text-white">Catálogo de Veículos</h1>

    <div class="flex flex-wrap gap-3 mb-5">
      <input id="busca" type="text" placeholder="🔍 Buscar por nome ou marca" value="${esc(f.busca)}" oninput="setBusca(this.value)" class="flex-1 min-w-[220px]">
      <select onchange="setF('ordem', this.value)">
        <option value="recentes" ${f.ordem==='recentes'?'selected':''}>Mais novos</option>
        <option value="menor" ${f.ordem==='menor'?'selected':''}>Menor preço</option>
        <option value="maior" ${f.ordem==='maior'?'selected':''}>Maior preço</option>
      </select>
    </div>

    <p class="font-semibold mb-2 text-slate-300">Categoria:</p>
    <div class="flex flex-wrap gap-2 mb-4">
      <button class="chip ${f.categoria==='todas'?'on':''}" onclick="setF('categoria','todas')">Todas</button>
      <button class="chip ${f.categoria==='carro'?'on':''}" onclick="setF('categoria','carro')">🚗 Carros</button>
      <button class="chip ${f.categoria==='moto'?'on':''}" onclick="setF('categoria','moto')">🏍️ Motos</button>
    </div>

    <p class="font-semibold mb-2 text-slate-300">Marca:</p>
    <div class="flex flex-wrap gap-2 mb-4">${chips(marcasLista.map(m => [m, m]), 'marca', f.marca)}</div>

    <p class="font-semibold mb-2 text-slate-300">Status:</p>
    <div class="flex flex-wrap gap-2 mb-6">${chips([['disponível','Disponíveis'],['reservado','Reservados'],['vendido','Vendidos']], 'status', f.status, 'Todos')}</div>

    <p class="text-slate-400 mb-4">${list.length} veículo(s) encontrado(s)</p>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${list.map(card).join('') || '<p class="text-slate-400">Nenhum veículo encontrado com esses filtros.</p>'}</div>
  </div>`;
}

function pageDetail() {
  const v = selected;
  const imgs = v.imagens && v.imagens.length ? v.imagens : [foto(v)];
  const info = [['Categoria', v.categoria === 'moto' ? 'Moto' : 'Carro'], ['Marca', v.marca], ['Ano', v.ano], ['Quilometragem', km(v.km)], ['Combustível', v.combustivel], ['Câmbio', v.cambio], ['Cor', v.cor]];
  return `
  <div class="container mx-auto px-4 py-8">
    <button onclick="go('vehicles')" class="text-blue-400 hover:text-blue-300 mb-4">← Voltar ao catálogo</button>
    <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
      <img class="gallery-main" src="${esc(imgs[imgIndex])}" onerror="${FALLBACK}" onclick="openLb(${v.id}, ${imgIndex})" alt="${esc(v.nome)}">
      <div class="flex gap-2 mt-4 overflow-x-auto">${imgs.map((im,i) => `<img class="thumb ${i===imgIndex?'on':''}" src="${esc(im)}" onerror="${FALLBACK}" onclick="setImg(${i})">`).join('')}</div>
      <div class="flex flex-wrap items-center gap-3 mt-5">
        <h1 class="text-3xl font-bold text-white">${esc(v.nome)}</h1>
        <span class="px-3 py-1 rounded text-sm text-white ${statusColor(v.status)}">${esc(cap(v.status))}</span>
      </div>
      <p class="text-blue-400 text-4xl font-bold mt-2">${price(v.preco)}</p>
      <div class="grid md:grid-cols-2 gap-6 mt-6">
        <div class="space-y-1">${info.map(([k,val]) => `<p class="text-slate-300"><strong class="text-white">${k}:</strong> ${esc(val)}</p>`).join('')}</div>
        <div><p class="text-slate-300"><strong class="text-white">Descrição:</strong><br>${esc(v.descricao || '—')}</p></div>
      </div>
      <div class="mt-8 text-center">
        <a class="wpp" target="_blank" href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('Olá ' + WHATSAPP_NAME + ', vim pelo site JM Veículos e tenho interesse no ' + v.nome + '!')}">WhatsApp: ${WHATSAPP_LABEL} - ${WHATSAPP_NAME}</a>
      </div>
    </div>
  </div>`;
}

/* ============ RENDER ============ */
function render() {
  let body = page === 'home' ? pageHome() : page === 'vehicles' ? pageVehicles() : (page === 'detail' && selected) ? pageDetail() : pageHome();

  let html = `
  <div class="min-h-screen flex flex-col">
    <nav class="bg-slate-800 shadow-md sticky top-0 z-50 border-b border-slate-700">
      <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <div class="text-2xl font-bold cursor-pointer" onclick="go('home')"><span class="text-blue-500">JM</span> <span class="text-slate-400">VEÍCULOS</span></div>
        <div class="flex gap-2">
          <button onclick="go('home')" class="px-3 py-2 text-slate-300 hover:text-white">Home</button>
          <button onclick="go('vehicles')" class="px-3 py-2 text-slate-300 hover:text-white">Veículos</button>
        </div>
      </div>
    </nav>
    <main class="flex-grow">${body}</main>
    <footer class="bg-slate-900 text-slate-400 text-center py-4 border-t border-slate-800">© ${new Date().getFullYear()} JM Veículos - Excelência, estilo e confiança</footer>
  </div>`;

  if (lb.open) {
    html += `<div class="lightbox" onclick="closeLb()">
      <div style="position:absolute;top:16px;right:32px;color:#fff;font-size:36px;cursor:pointer">✕</div>
      ${lb.i > 0 ? `<button class="lb-btn" style="left:20px" onclick="event.stopPropagation();lbMove(-1)">◀</button>` : ''}
      <img src="${esc(lb.imgs[lb.i])}" onclick="event.stopPropagation()">
      ${lb.i < lb.imgs.length - 1 ? `<button class="lb-btn" style="right:20px" onclick="event.stopPropagation();lbMove(1)">▶</button>` : ''}
    </div>`;
  }
  document.getElementById('app').innerHTML = html;
}

load();
</script>
</body>
</html>
